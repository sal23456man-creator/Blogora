{% extends "layout.html" %}
{% block content %}

<section class="auth-page">

    <div class="auth-box">

        <h1>Create Account</h1>
        <p>Join Blogora and start sharing your stories</p>

        <form method="POST">

            <input 
                type="text" 
                name="username" 
                placeholder="Choose username"
                required
            >

            <input 
                type="email" 
                name="email" 
                placeholder="Enter your email"
                required
            >

            <input 
                type="password" 
                name="password" 
                placeholder="Create password"
                required
            >

            <button type="submit">Register</button>

        </form>

        <p class="switch-auth">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</section>

{% endblock %}
